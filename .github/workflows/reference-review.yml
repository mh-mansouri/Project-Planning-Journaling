name: reference-review

# Link-liveness is mechanical and handled weekly by check-links.yml. Whether a
# source is still the most reputable choice — still cited/adopted elsewhere,
# no newer edition, nothing better-established has since emerged — needs a
# human (or Claude) judgment call. This opens one tracking issue on the same
# weekly cadence so that review actually happens instead of being implied.
# It never opens a second issue while one is still open.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open (or skip) the weekly reference-review issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly reference & link review";

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              console.log(`Still open from last week: #${existing.number} — skipping.`);
              return;
            }

            const body = [
              "Automated weekly reminder, paired with the `check-links` workflow (which",
              "already re-verified that every link resolves).",
              "",
              "This half needs judgment: for each source below, re-confirm it's still the",
              "most reputable choice available — still cited or adopted elsewhere, no newer",
              "edition, nothing better-established has since emerged. Full writeup and the",
              "citation evidence for each is in",
              "[`project-planning-journaling/references/research.md`](../blob/main/project-planning-journaling/references/research.md).",
              "",
              "### Open references",
              "- [ ] Michael Nygard — Documenting Architecture Decisions",
              "- [ ] joelparkerhenderson/architecture-decision-record",
              "- [ ] Diátaxis documentation framework",
              "- [ ] Keep a Changelog",
              "- [ ] Conventional Commits",
              "- [ ] Semantic Versioning 2.0.0",
              "- [ ] GitHub Open Source Guides",
              "- [ ] GOV.UK Service Manual — discovery phase",
              "- [ ] The Scrum Guide (2020)",
              "- [ ] arc42 template",
              "",
              "### Closed references (concept only)",
              "- [ ] The Mythical Man-Month",
              "- [ ] The Lean Startup",
              "- [ ] Working in Public",
              "- [ ] PMBOK Guide",
              "- [ ] Accelerate",
              "",
              "Close this issue once reviewed. If a source should be replaced or a newer",
              "edition has shipped (e.g. a future Scrum Guide or PMBOK revision), open a PR",
              "updating `research.md` — and `NOTICE.md` too if a bundled file changes.",
            ].join("\n");

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            console.log(`Opened #${created.data.number}`);
